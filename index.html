<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Lake Nightmare (8-Bit)</title>
    <style>
/* ---------------------------------
   Step 11: Friday 13th 8-Bit CSS Styling
   --------------------------------- */

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
    /* 8-bit Color Palette: Dark, Gritty, and Blood-themed */
    --color-dark: #12100e;   /* Almost black */
    --color-blood: #881c1c;  /* Deep crimson */
    --color-wood: #4a342a;   /* Cabin wood/Brown */
    --color-moss: #2c4a2a;   /* Forest green/Moss */
    --color-text: #e0e0e0;   /* Off-white retro text */
    --color-accent: #7a7a7a; /* Grey/Metallic accent */
    --color-dead: #333;      /* Gray for dead bodies */
    --canvas-size: min(80vh, 80vw); /* Responsive canvas sizing */
}

/* Base Body and Layout */
body {
    font-family: 'Press Start 2P', monospace;
    background-color: var(--color-dark);
    color: var(--color-text);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center; /* <-- FIX 1: Was 'align' */
    min-height: 100vh;
    overflow: hidden;
    text-align: center;
    box-sizing: border-box;
}

/* Main Game Container - The Arcade Cabinet Look */
#game-container {
    width: 95vw;
    max-width: 1200px;
    border: 8px solid var(--color-wood);
    background-color: #1a1a1a;
    /* Retro 3D effect/border shadow */
    box-shadow: 0 0 0 4px var(--color-moss), 0 0 0 12px var(--color-dark);
    padding: 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center; /* <-- FIX 2: Was 'align' */
    box-sizing: border-box;
}

/* Title Styling - Aggressive/Bloody look */
h1 {
    font-size: 1.5rem;
    color: var(--color-blood);
    text-shadow: 4px 4px 0px var(--color-dark); /* Heavy 8-bit drop shadow */
    margin-bottom: 20px;
}
h2 {
    font-size: 1rem;
    margin-bottom: 20px;
}

/* ------------------ UI Screens and Buttons ------------------ */

.screen {
    width: 100%;
    display: none; /* Controlled by JavaScript */
    flex-direction: column;
    align-items: center; /* <-- FIX 3: Was 'align' */
}

#main-menu, #jason-selector-screen {
    padding: 40px 20px;
}

/* Menu Buttons */
.menu-button {
    background-color: var(--color-blood);
    color: var(--color-text);
    border: 4px solid var(--color-wood);
    padding: 12px 24px;
    margin: 10px;
    cursor: pointer;
    font-size: 0.8rem;
    text-transform: uppercase;
    box-shadow: 4px 4px 0px var(--color-dark);
    transition: all 0.1s;
}

.menu-button:hover {
    background-color: #a32424;
    box-shadow: 2px 2px 0px var(--color-dark);
    transform: translate(2px, 2px); /* Click/press effect */
}

/* Jason Selector Cards */
.jason-card {
    background-color: var(--color-wood);
    border: 4px solid var(--color-dark);
    padding: 15px;
    margin: 10px;
    width: 150px;
    cursor: pointer;
    display: inline-block;
    box-shadow: 4px 4px 0px var(--color-dark);
    opacity: 0.5; /* Locked state visual */
}

.jason-card.unlocked {
    opacity: 1;
    border-color: var(--color-blood);
}

.jason-card.unlocked:hover {
    background-color: #5c443b;
}

/* ------------------ Game Screen Layout ------------------ */
#game-screen {
    display: flex;
    flex-direction: row;
    gap: 20px;
    justify-content: center;
    width: 100%;
}

#game-canvas {
    background-color: var(--color-moss);
    border: 4px solid var(--color-dark);
    image-rendering: pixelated; /* CRITICAL for 8-bit look */
    width: var(--canvas-size);
    height: var(--canvas-size);
    min-width: 300px;
    min-height: 300px;
    box-sizing: content-box;
}

/* Game UI Panel */
#game-ui {
    width: 200px;
    background-color: var(--color-wood);
    border: 4px solid var(--color-dark);
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center; /* <-- FIX 4: Was 'align' */
    box-sizing: border-box;
}

.ui-section {
    margin-bottom: 15px;
    padding: 5px;
    width: 100%;
    border-bottom: 2px dashed var(--color-accent);
}

.ui-section:last-child {
    border-bottom: none;
}

.stat-label {
    font-size: 0.6rem;
    margin-bottom: 5px;
    text-align: left;
    width: 100%;
    color: var(--color-accent);
}
.stat-value {
    font-size: 0.7rem;
    color: var(--color-blood);
    text-shadow: 1px 1px 0 var(--color-dark);
}

/* Health Bar */
#health-bar-container {
    border: 2px solid var(--color-dark); 
    background-color: #333;
    width: 100%;
}

#health-bar-fill {
    height: 12px;
    background-color: var(--color-blood);
    transition: width 0.3s;
}

/* Ability Buttons */
.ability-button {
    background-color: var(--color-dark);
    color: var(--color-text);
    border: 2px solid var(--color-accent);
    padding: 8px;
    margin-top: 5px;
    width: 100%;
    cursor: pointer;
    font-size: 0.6rem;
    line-height: 1;
}

.ability-button.cooldown {
    opacity: 0.5;
    cursor: not-allowed;
    background-color: #333;
    color: var(--color-accent);
}

.ability-button:not(.cooldown):hover {
    background-color: #3f3f3f;
}

/* ------------------ Mobile Responsiveness ------------------ */
@media (max-width: 768px) {
    h1 {
        font-size: 1rem;
    }
    .menu-button {
        font-size: 0.6rem;
        padding: 10px 18px;
    }
    #game-screen {
        flex-direction: column;
        gap: 10px;
    }
    #game-canvas {
        width: 100%;
        height: 50vh;
        max-width: none;
        max-height: none;
    }
    #game-ui {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
        border-top: 4px solid var(--color-dark);
        border-left: 0;
        border-right: 0;
        padding: 10px 0;
    }
    .ui-section {
        width: 45%;
        margin-bottom: 5px;
        border-bottom: none;
    }
}
    </style>
</head>
<body>

    <div id="game-container">
        <h1>CRYSTAL LAKE NIGHTMARE</h1>
        
        <!-- Main Menu Screen (Visible on startup) -->
        <div id="main-menu" class="screen" style="display: flex;">
            <button class="menu-button" onclick="window.showScreen('jason-selector-screen')">Start Game</button>
            <button class="menu-button">Options (WIP)</button>
            <button class="menu-button">Credits (WIP)</button>
        </div>

        <!-- Jason Selector Screen -->
        <div id="jason-selector-screen" class="screen">
            <h2>Select Jason</h2>
            <div id="jason-list">
                <!-- Jason 1 (Default) -->
                <div id="jason-1" class="jason-card unlocked" data-jason-id="1">
                    <p>Part 3 Jason</p>
                    <p style="font-size:0.5rem; color: #aaa;">(Unlocked)</p>
                </div>
                <!-- Placeholder for future Jasons -->
                <div class="jason-card" data-jason-id="2">
                    <p>Part 4 Jason</p>
                    <p style="font-size:0.5rem; color: #aaa;">(LOCKED - COMING SOON)</p>
                </div>
            </div>
            <button class="menu-button" onclick="window.startGame(1)">Begin Hunt</button>
            <button class="menu-button" onclick="window.showScreen('main-menu')">Back</button>
        </div>

        <!-- Game Screen (Hidden on startup) -->
        <div id="game-screen" class="screen">
            
            <!-- Game Canvas -->
            <canvas id="game-canvas"></canvas>

            <!-- Game UI Panel -->
            <div id="game-ui">
                <!-- Health Section -->
                <div class="ui-section">
                    <div class="stat-label">JASON'S HEALTH</div>
                    <div id="health-bar-container">
                        <div id="health-bar-fill" style="width: 100%;"></div>
                    </div>
                </div>

                <!-- Ability Section -->
                <div class="ui-section">
                    <div class="stat-label">ATTACK/ABILITIES</div>
                    <button id="ability-attack" class="ability-button" onclick="window.handleAbility('attack')">Attack (Space)</button>
                    <button id="ability-dash" class="ability-button" onclick="window.handleAbility('dash')">Dash (Q)</button>
                    <button id="ability-vision" class="ability-button" onclick="window.handleAbility('vision')">Vision (V)</button>
                    <button id="ability-teleport" class="ability-button" onclick="window.handleAbility('teleport')">Teleport (E)</button>
                    <button id="ability-rage" class="ability-button" onclick="window.handleAbility('rage')">Rage (R)</button>
                </div>
                
                <!-- Ability Status -->
                <div class="ui-section">
                    <div class="stat-label">ABILITY STATUS: <span id="ability-status" class="stat-value">Normal</span></div>
                </div>

                <!-- Counselors Left/Goal Status -->
                <div class="ui-section">
                    <div class="stat-label">COUNSELORS LEFT: <span id="counselor-count" class="stat-value">7</span></div>
                    <div class="stat-label">ESCAPE STATUS: <span id="escape-status" class="stat-value">Unprepared</span></div>
                </div>
            </div>
        </div> <!-- End of game-screen -->
        
    </div>

</body>
<script type="module">
// ---------------------------------
// Helper: Collision Utility
// ---------------------------------

/**
 * Checks for Axis-Aligned Bounding Box (AABB) collision between two rectangles.
 * @param {number} r1x - Rectangle 1's X position.
 * @param {number} r1y - Rectangle 1's Y position.
 * @param {number} r1w - Rectangle 1's Width.
 * @param {number} r1h - Rectangle 1's Height.
 * @param {number} r2x - Rectangle 2's X position.
 * @param {number} r2y - Rectangle 2's Y position.
 * @param {number} r2w - Rectangle 2's Width.
 * @param {number} r2h - Rectangle 2's Height.
 * @returns {boolean} True if they are colliding.
 */
function checkAABB(r1x, r1y, r1w, r1h, r2x, r2y, r2w, r2h) {
    return r1x < r2x + r2w &&
           r1x + r1w > r2x &&
           r1y < r2y + r2h &&
           r1y + r1h > r2y;
}

// ---------------------------------
// Counselor AI Module 
// ---------------------------------

const COUNSELOR_SIZE = 24; // Counselors are slightly smaller than Jason (64)

// Defines the base properties for an AI Counselor
const baseCounselor = {
    x: 0,
    y: 0,
    size: COUNSELOR_SIZE, 
    speed: 2, // Slower than Jason
    health: 100, // Counselors need 2 hits to die (50 damage per hit)
    isAlive: true,
    targetX: 0,
    targetY: 0,
    state: 'wandering', // States: 'wandering', 'escaping', 'repairing', 'dead'
    isLoud: false, 
    inventory: {
        battery: false,
        gas: false,
        keys: false,
        radio: false,
        machete: false, 
    }
};

/**
 * Creates a counselor object with random properties and position.
 * @param {number} worldWidth - Width of the game WORLD.
 * @param {number} worldHeight - Height of the game WORLD.
 */
function createCounselor(worldWidth, worldHeight, isTommy = false) {
    const counselor = { ...baseCounselor };

    // Spawn randomly outside the central cabin area (150x150 center)
    const centerX = worldWidth / 2;
    const centerY = worldHeight / 2;
    const cabinRadius = 75; // Half of cabin size

    let x, y;
    do {
        // Random position within map bounds
        x = Math.random() * (worldWidth - counselor.size);
        y = Math.random() * (worldHeight - counselor.size);
    } while (
        x > centerX - cabinRadius && 
        x < centerX + cabinRadius && 
        y > centerY - cabinRadius && 
        y < centerY + cabinRadius
    ); // Reroll if spawned inside the cabin

    counselor.x = x;
    counselor.y = y;
    counselor.targetX = x;
    counselor.targetY = y;
    
    if (isTommy) {
        counselor.inventory.machete = true;
        counselor.health = 150; // Tommy is tougher
    }
    
    return counselor;
}

/**
 * Creates an array of counselors.
 * @param {number} worldWidth - Width of the game WORLD.
 * @param {number} worldHeight - Height of the game WORLD.
 */
function createCounselors(count, worldWidth, worldHeight) {
    const counselors = [];
    for (let i = 0; i < count; i++) {
        counselors.push(createCounselor(worldWidth, worldHeight));
    }
    return counselors;
}

/**
 * Updates the state and position of a single counselor (simple wandering AI).
 * @param {number} worldWidth - Width of the game WORLD.
 * @param {number} worldHeight - Height of the game WORLD.
 */
function updateCounselor(counselor, worldWidth, worldHeight) {
    if (!counselor.isAlive || counselor.state !== 'wandering') return;
    
    const dx = counselor.targetX - counselor.x;
    const dy = counselor.targetY - counselor.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    // Check if counselor has reached target or needs a new one (randomly)
    if (distance < counselor.speed || Math.random() < 0.01) {
        // Set a new random target point
        counselor.targetX = Math.random() * (worldWidth - counselor.size);
        counselor.targetY = Math.random() * (worldHeight - counselor.size);
    } else {
        // Move towards the target
        counselor.x += (dx / distance) * counselor.speed;
        counselor.y += (dy / distance) * counselor.speed;
    }
    
    // Keep counselor within map bounds
    counselor.x = Math.max(0, Math.min(worldWidth - counselor.size, counselor.x));
    counselor.y = Math.max(0, Math.min(worldHeight - counselor.size, counselor.y));
}


// ---------------------------------
// Player Module (Jason)
// ---------------------------------

// --- 1. Global Player State and Input ---
const WORLD_WIDTH_P = 2400; // World is 3x3 screens
const WORLD_HEIGHT_P = 2400;

// Global variable to track if dash is currently active (used for speed reset)
let isDashing = false;

// Defines the main player character (Jason)
const jason = {
    x: WORLD_WIDTH_P / 2, // Start in the center of the WORLD (horizontally)
    y: (WORLD_HEIGHT_P / 2) + 85, // <-- FIX: Spawn just BELOW the cabin (not in it)
    width: 64, // Use width/height for collision
    height: 64, // Spritesheet aspect ratio is 1:2, but hitbox is 1:1
    
    frameWidth: 32, // The width of a single sprite frame in the sheet
    frameHeight: 64, // The height of a single sprite frame in the sheet
    
    baseSpeed: 3,
    currentSpeed: 3,
    health: 100,
    maxHealth: 100,
    currentJasonId: 1,
    direction: 'down', 
    isMoving: false,
    
    // Animation state
    currentFrame: 0, 
    frameTimer: 0,
    frameDelay: 8, 
    
    // Attack state
    isAttacking: false,
    attack: { cooldown: 60, cooldownTimer: 0 }, // 1 second cooldown
    
    // Ability state
    isVisionActive: false,
    isRageActive: false,
    abilities: {
        dash: { cooldown: 180, cooldownTimer: 0, duration: 60, durationTimer: 0 }, // 3s CD, 1s duration
        vision: { cooldown: 480, cooldownTimer: 0, duration: 300, durationTimer: 0 }, // 8s CD, 5s duration
        teleport: { cooldown: 600, cooldownTimer: 0, duration: 0, durationTimer: 0 }, // 10s CD
        rage: { cooldown: 1800, cooldownTimer: 0, duration: 0, durationTimer: 0 } // 30s CD (only used once)
    }
};

// Tracks key presses for smooth movement
const keys = {
    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false,
    w: false,
    s: false,
    a: false,
    d: false,
    ' ': false, // Spacebar for Attack
    q: false, // Dash
    v: false, // Vision
    e: false, // Teleport
    r: false  // Rage
};

// --- SPRITESHEET DATA ---
const FRAME_SIZE = 32;
const ROW_SIZE = 64;

// This object defines the (x, y) coordinates on the spritesheet for each frame
const JASON_ANIMATIONS = {
    'down': [
        { sx: 0 * FRAME_SIZE, sy: 0 * ROW_SIZE },
        { sx: 1 * FRAME_SIZE, sy: 0 * ROW_SIZE }
    ],
    'left': [
        { sx: 0 * FRAME_SIZE, sy: 1 * ROW_SIZE },
        { sx: 1 * FRAME_SIZE, sy: 1 * ROW_SIZE }
    ],
    'right': [
        { sx: 0 * FRAME_SIZE, sy: 2 * ROW_SIZE },
        { sx: 1 * FRAME_SIZE, sy: 2 * ROW_SIZE }
    ],
    'up': [
        { sx: 0 * FRAME_SIZE, sy: 3 * ROW_SIZE },
        { sx: 1 * FRAME_SIZE, sy: 3 * ROW_SIZE }
    ]
};

// --- 2. Input Handling ---
function handleKeyDown(event) {
    const key = event.key.toLowerCase();
    
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 's', 'a', 'd', ' '].includes(key)) {
        event.preventDefault(); // Prevent page scroll on game keys
    }
    
    if (keys.hasOwnProperty(key)) {
        keys[key] = true;
    }
    if (event.key === ' ') {
        keys[' '] = true;
    }
}

function handleKeyUp(event) {
    const key = event.key.toLowerCase();
    if (keys.hasOwnProperty(key)) {
        keys[key] = false;
    }
    if (event.key === ' ') {
        keys[' '] = false;
    }
}

function initializePlayerInput() {
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
}


// --- 3. Player Movement Logic (NEW: With Collision) ---
/**
 * Handles all player movement based on keyboard input, and updates animation state.
 * @param {number} worldWidth - Width of the game WORLD.
 * @param {number} worldHeight - Height of the game WORLD.
 * @param {Array<object>} obstacles - List of obstacle objects for collision.
 */
function handlePlayerMovement(worldWidth, worldHeight, obstacles) {
    let moved = false;
    let dx = 0;
    let dy = 0;

    // Check for combined keyboard inputs (WASD or Arrows)
    if (keys.ArrowUp || keys.w) {
        dy -= jason.currentSpeed;
        jason.direction = 'up';
        moved = true;
    }
    if (keys.ArrowDown || keys.s) {
        dy += jason.currentSpeed;
        jason.direction = 'down';
        moved = true;
    }
    if (keys.ArrowLeft || keys.a) {
        dx -= jason.currentSpeed;
        jason.direction = 'left';
        moved = true;
    }
    if (keys.ArrowRight || keys.d) {
        dx += jason.currentSpeed;
        jason.direction = 'right';
        moved = true;
    }

    // Diagonal movement normalization 
    if (dx !== 0 && dy !== 0) {
        const diagonalFactor = 1 / Math.sqrt(2);
        dx *= diagonalFactor;
        dy *= diagonalFactor;
    }
    
    jason.isMoving = moved;
    
    // --- NEW: Collision-aware movement ---
    
    // Check X-axis collision
    let targetX = jason.x + dx;
    let targetY = jason.y; // Check X move at current Y
    
    let collidedX = false;
    for (const obstacle of obstacles) {
        if (checkAABB(targetX, targetY, jason.width, jason.height, obstacle.x, obstacle.y, obstacle.width, obstacle.height)) {
            collidedX = true;
            break;
        }
    }
    if (!collidedX) {
        jason.x = targetX; // Apply X movement
    }

    // Check Y-axis collision
    targetX = jason.x; // Check Y move at *new* X
    targetY = jason.y + dy;
    
    let collidedY = false;
    for (const obstacle of obstacles) {
        if (checkAABB(targetX, targetY, jason.width, jason.height, obstacle.x, obstacle.y, obstacle.width, obstacle.height)) {
            collidedY = true;
            break;
        }
    }
    if (!collidedY) {
        jason.y = targetY; // Apply Y movement
    }
    
    // Keep Jason within the WORLD bounds
    jason.x = Math.max(0, Math.min(worldWidth - jason.width, jason.x));
    jason.y = Math.max(0, Math.min(worldHeight - jason.height, jason.y));


    // --- Animation Update Logic ---
    if (jason.isMoving) {
        jason.frameTimer++;
        if (jason.frameTimer >= jason.frameDelay) {
            jason.currentFrame = (jason.currentFrame + 1) % JASON_ANIMATIONS[jason.direction].length;
            jason.frameTimer = 0;
        }
    } else {
        jason.currentFrame = 0;
        jason.frameTimer = 0;
    }
}

// --- 4. Player Abilities and Attack Logic ---

/**
 * Helper function for teleport to avoid spawning in obstacles
 */
function checkTeleportCollision(x, y, obstacles) {
     for (const obstacle of obstacles) {
        if (checkAABB(x, y, jason.width, jason.height, obstacle.x, obstacle.y, obstacle.width, obstacle.height)) {
            return true; // Collided
        }
    }
    return false; // Safe
}

/**
 * Handles activation of abilities via hotkeys or UI.
 * @param {string} abilityName - The name of the ability to activate.
 * @param {Array<object>} obstacles - List of obstacles (for teleport).
 */
function activateAbility(abilityName, obstacles = []) {
    // Handle standard abilities
    if (abilityName !== 'attack') {
        const ability = jason.abilities[abilityName];
        if (!ability || ability.cooldownTimer > 0 || (abilityName === 'rage' && jason.isRageActive)) {
            return;
        }

        ability.cooldownTimer = ability.cooldown; 

        switch (abilityName) {
            case 'dash':
                isDashing = true;
                jason.currentSpeed = jason.baseSpeed * 2.5; 
                ability.durationTimer = ability.duration;
                break;
            case 'vision':
                jason.isVisionActive = true;
                ability.durationTimer = ability.duration;
                break;
            case 'teleport':
                const oldX = jason.x;
                const oldY = jason.y;
                let newX, newY;
                
                do {
                    newX = Math.random() * (WORLD_WIDTH_P - jason.width);
                    newY = Math.random() * (WORLD_HEIGHT_P - jason.height);
                } while (
                    // Check 1: Not too close to old spot
                    Math.sqrt(Math.pow(newX - oldX, 2) + Math.pow(newY - oldY, 2)) < 300 ||
                    // Check 2: Not inside an obstacle
                    checkTeleportCollision(newX, newY, obstacles) 
                );

                jason.x = newX;
                jason.y = newY;
                break;
            case 'rage':
                jason.isRageActive = true;
                jason.baseSpeed *= 1.5; 
                jason.currentSpeed = jason.baseSpeed; 
                break;
        }
    } else {
        // Handle Attack (Spacebar)
        if (jason.attack.cooldownTimer === 0) {
             jason.isAttacking = true;
             jason.attack.cooldownTimer = jason.attack.cooldown;
        }
    }
}

/**
 * Updates all ability and attack cooldowns and active durations every frame.
 * @param {Array<object>} obstacles - List of obstacles (for teleport).
 */
function updateAbilitiesAndAttack(obstacles) {
    // 1. Check hotkeys (Q, V, E, R, Spacebar)
    if (keys.q) activateAbility('dash');
    if (keys.v) activateAbility('vision');
    if (keys.e) activateAbility('teleport', obstacles);
    if (keys.r) activateAbility('rage');
    if (keys[' ']) activateAbility('attack'); // Check attack hotkey

    // 2. Update Attack Timer
    if (jason.attack.cooldownTimer > 0) {
        jason.attack.cooldownTimer--;
    }
    
    // Attack duration is very short (e.g., 5 frames)
    if (jason.attack.cooldownTimer === jason.attack.cooldown - 5) {
        jason.isAttacking = false;
    }

    // 3. Update Ability TimERS
    for (const abilityName in jason.abilities) {
        const ability = jason.abilities[abilityName];
        
        if (ability.cooldownTimer > 0) {
            ability.cooldownTimer--;
        }
        
        if (ability.durationTimer > 0) {
            ability.durationTimer--;
            
            if (ability.durationTimer === 0) {
                if (abilityName === 'dash') {
                    isDashing = false;
                    jason.currentSpeed = jason.baseSpeed; // Reset speed
                }
                if (abilityName === 'vision') {
                    jason.isVisionActive = false;
                }
            }
        }
    }

    // 4. Speed enforcement
    if (!isDashing) {
        jason.currentSpeed = jason.baseSpeed;
    }
}


// ---------------------------------
// Game Manager Module (Central Core)
// ---------------------------------

// --- 1. Global Game State and Constants ---
let canvas;
let ctx;

const CANVAS_WIDTH = 800; // The size of the window
const CANVAS_HEIGHT = 800;
const WORLD_WIDTH = 2400; // The size of the actual map
const WORLD_HEIGHT = 2400;

let isGameRunning = false;
let counselors = []; // Array to hold all AI counselors

// Asset Storage
let jasonSpriteImage;

// NEW: Camera and Obstacles
const camera = {
    x: 0,
    y: 0,
    width: CANVAS_WIDTH,
    height: CANVAS_HEIGHT
};

const obstacles = [
    { 
        x: (WORLD_WIDTH / 2) - 75, // Centered cabin
        y: (WORLD_HEIGHT / 2) - 75,
        width: 150, 
        height: 150, 
        name: "Jason's Cabin",
        color: '#4a342a'
    }
    // We can add more obstacles here (trees, rocks, other cabins)
];
let items = []; // Gas, Batteries, Keys; basically all stuff needed for counselors to escape
let objectives = []; // Car, Phonebox; stuff needed to complete that allows the counselors to win


// --- 2. Asset Loading ---
function loadAssets() {
    return new Promise((resolve) => {
        jasonSpriteImage = new Image();
        // --- MANDATORY USER PATH INSTRUCTION APPLIED ---
        jasonSpriteImage.src = "images/sprites/jason-base-spritesheet.png";        // ------------------------------------------------

        jasonSpriteImage.onload = () => {
            console.log("Jason spritesheet loaded successfully.");
            resolve();
        };
        jasonSpriteImage.onerror = () => {
            console.error(`Failed to load Jason spritesheet from: ${jasonSpriteImage.src}`);
            resolve(); 
        }
    });
}
function getSafeSpawn(worldWidth, worldHeight, obstacles, minDistance = 100) {
    let x, y;
    let isSafe = false;
    while (!isSafe) {
        x = Math.random() * (worldWidth - 30); //Just a rough estimate of item size, might need to change it
        y = Math.random() * (worldHeight - 30);

        isSafe = true; // Assume safe
    
        // Check against obstacles
        for (const obstacle of obstacles) {
            // Check of spawn is too close to obstacle or inside
            if (checkAABB(x, y, 30, 30, obstacle.x, obstacle.y, obstacle.width, obstacle.height)) {
                isSafe = false;
                break;
            }
        }
    }
    return { x, y };
}
function initializeWorldObjects() {
    // 1. Make the Car Repair Items
    const gasSpawm = getSafeSpawn(WORLD_WIDTH, WORLD_HEIGHT, obstacles);
    items.push({
        type: 'gas', x: gasSpawn.x, y:gasSpawn.y, size: 30, color: '#E8E40C', name: 'Gas', isCollected: false
    });
    const batterySpawn = getSafeSpawn(WORLD_WIDTH, WORLD_HEIGHT, obstacles);
    items.push({
        type: 'battery', x: batterySpawn.x, y:batterySpawn.y, size: 30, color: '#0CEC0C', name: 'Battery', isCollected: false
    });
    
}

// --- 3. Menu and Screen Functions (Called by index.html buttons) ---
window.showScreen = function(id) {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.style.display = 'none';
    });
    const screenToShow = document.getElementById(id);
    if (screenToShow) {
        screenToShow.style.display = 'flex';
    }
}

window.startGame = async function(jasonId) {
    await loadAssets();

    jason.currentJasonId = jasonId;
    isGameRunning = true;
    
    // Initialize Canvas to fixed screen size
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    
    // Initialize Counselors in the WORLD
    counselors = createCounselors(7, WORLD_WIDTH, WORLD_HEIGHT);

    window.showScreen('game-screen');
    
    gameLoop();
}

/**
 * Global function to handle ability activation from UI buttons.
 */
window.handleAbility = (abilityName) => {
    // Pass obstacles list when activating from UI
    activateAbility(abilityName, obstacles);
};


// --- 4. Core Game Logic (Update) ---

/**
 * Updates the camera position to follow Jason, clamped to world bounds.
 */
function updateCamera() {
    // Center camera on Jason
    camera.x = jason.x - (CANVAS_WIDTH / 2) + (jason.width / 2);
    camera.y = jason.y - (CANVAS_HEIGHT / 2) + (jason.height / 2);

    // Clamp camera to world boundaries
    camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - CANVAS_WIDTH));
    camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - CANVAS_HEIGHT));
}

function update() {
    if (!isGameRunning) return;

    // 1. Handle Player Input and Movement (with obstacle collision)
    handlePlayerMovement(WORLD_WIDTH, WORLD_HEIGHT, obstacles); 

    // 2. Update Abilities and Attack Timers
    updateAbilitiesAndAttack(obstacles);

    // 3. Handle Attack and Collision
    if (jason.isAttacking) {
        const ATTACK_SIZE_BUFFER = 20; 
        const attackHitboxX = jason.x - ATTACK_SIZE_BUFFER / 2;
        const attackHitboxY = jason.y - ATTACK_SIZE_BUFFER / 2;
        const attackHitboxW = jason.width + ATTACK_SIZE_BUFFER;
        const attackHitboxH = jason.height + ATTACK_SIZE_BUFFER;

        counselors.forEach(counselor => {
            if (counselor.isAlive && checkAABB(
                attackHitboxX, attackHitboxY, attackHitboxW, attackHitboxH,
                counselor.x, counselor.y, counselor.size, counselor.size
            )) {
                
                counselor.health -= 50; 
                
                if (counselor.health <= 0) {
                    counselor.isAlive = false;
                    console.log("Counselor eliminated!");
                } else {
                    console.log("Counselor damaged! Health remaining: " + counselor.health);
                }
            }
        });
    }

    // 4. Handle AI movement
    counselors.forEach(counselor => {
        updateCounselor(counselor, WORLD_WIDTH, WORLD_HEIGHT);
    });
    
    // 5. Update Camera Position
    updateCamera();

    // 6. Update UI
    updateUI();
}

// --- 5. Drawing and Rendering (NEW: Camera-aware) ---

function drawJason() {
    // Draw relative to the world, camera translation handles screen position
    
    // Only draw the spritesheet if it loaded correctly
    if (jasonSpriteImage && jasonSpriteImage.complete && jasonSpriteImage.naturalWidth > 0) {
        const animation = JASON_ANIMATIONS[jason.direction];
        if (!animation) return; 

        const frameData = animation[jason.currentFrame];
        const sx = frameData.sx; 
        const sy = frameData.sy; 
        const sw = jason.frameWidth; 
        const sh = jason.frameHeight; 
        
        const dx = jason.x; // World X
        const dy = jason.y; // World Y
        const dw = jason.width; // Draw width
        const dh = jason.height * (jason.frameHeight / jason.frameWidth); // Maintain aspect ratio

        // Draw the image frame
        ctx.drawImage(
            jasonSpriteImage,
            sx, sy, sw, sh,
            dx, dy, dw, dh
        );
        
        /*Optional: Draw a red box around Jason when attacking
        if (jason.isAttacking) {
             const ATTACK_SIZE_BUFFER = 20; 
             ctx.strokeStyle = '#FF0000';
             ctx.lineWidth = 4;
             ctx.strokeRect(
                 jason.x - ATTACK_SIZE_BUFFER/2, 
                 jason.y - ATTACK_SIZE_BUFFER/2, 
                 jason.width + ATTACK_SIZE_BUFFER, 
                 jason.height + ATTACK_SIZE_BUFFER
             );
        }*/

    } else {
        // Fallback: Draw a simple red box if image failed to load
        ctx.fillStyle = 'red';
        ctx.fillRect(jason.x, jason.y, jason.width, jason.height);
    }
}

function drawCounselors() {
    // Draw relative to the world
    counselors.forEach(counselor => {
        if (counselor.isAlive) {
            
            // Vision Mode Highlight 
            if (jason.isVisionActive) {
                 ctx.strokeStyle = '#FF0000'; // Red outline
                 ctx.lineWidth = 3;
                 ctx.strokeRect(counselor.x - 1, counselor.y - 1, COUNSELOR_SIZE + 2, COUNSELOR_SIZE + 2);
            }

            // Simple drawn counselor shape (Alive)
            ctx.fillStyle = '#4B8BFF'; // Blue shirt color
            ctx.fillRect(counselor.x, counselor.y, COUNSELOR_SIZE, COUNSELOR_SIZE);

            ctx.fillStyle = '#FFC300'; // Blonde/bright hair
            const headSize = COUNSELOR_SIZE / 2;
            ctx.fillRect(counselor.x + COUNSELOR_SIZE / 4, counselor.y, headSize, headSize);

        } else {
            // Simple drawn counselor shape (DEAD)
            ctx.fillStyle = 'var(--color-dead)'; // Grey color
            ctx.fillRect(counselor.x, counselor.y + COUNSELOR_SIZE / 2, COUNSELOR_SIZE, COUNSELOR_SIZE / 4);
            ctx.strokeStyle = 'var(--color-blood)';
            ctx.lineWidth = 1;
            ctx.strokeRect(counselor.x, counselor.y + COUNSELOR_SIZE / 2, COUNSELOR_SIZE, COUNSELOR_SIZE / 4);
        }
    });
}

function drawMap() {
    // Draw relative to the world
    
    // Draw the basic map background (Forest) - BIGGER
    ctx.fillStyle = '#2c4a2a'; // Moss/Forest background
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // Draw all obstacles
    obstacles.forEach(ob => {
        ctx.fillStyle = ob.color; // Cabin color
        ctx.fillRect(ob.x, ob.y, ob.width, ob.height);

        // Text Overlay
        ctx.font = '16px "Press Start 2P"';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.textAlign = 'center';
        ctx.fillText(ob.name, ob.x + ob.width / 2, ob.y + ob.height / 2 + 5);
    });


    // Vision Filter Overlay 
    if (jason.isVisionActive) {
        // Apply a dark, bloody red filter over the *entire world*
        // This will be clipped by the camera translation
        ctx.fillStyle = 'rgba(136, 28, 28, 0.4)'; 
        ctx.fillRect(camera.x, camera.y, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
}

/**
 * Main rendering function, handles camera translation.
 */
function draw() {
    // Clear the *visible* canvas
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // --- Save context and translate to camera position ---
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // --- Draw all game objects in WORLD coordinates ---
    drawMap();
    drawCounselors(); 
    drawJason(); 
    
    // --- Restore context to draw UI elements (if any) ---
    ctx.restore();
    
    // NOTE: Vision filter is now part of drawMap, but if we want it
    // to overlay Jason, it should be here, *after* restore.
    if (jason.isVisionActive) {
        // This draws the filter *over* the screen, including Jason
        ctx.fillStyle = 'rgba(136, 28, 28, 0.4)'; 
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
}


// --- 6. UI Update Logic ---

function updateUI() {
    // Update Health Bar (Static for now)
    const healthPercent = (jason.health / jason.maxHealth) * 100;
    const healthFill = document.getElementById('health-bar-fill');
    if (healthFill) {
        healthFill.style.width = `${healthPercent}%`;
    }

    // Update Counselor Count
    const aliveCount = counselors.filter(c => c.isAlive).length;
    const counselorCountSpan = document.getElementById('counselor-count');
    if (counselorCountSpan) {
        counselorCountSpan.textContent = aliveCount; 
    }
    
    // Update Attack Button
    const updateAttackButton = () => {
        const button = document.getElementById('ability-attack');
        if (!button) return;

        let displayState = `Attack (Space)`;
        button.classList.remove('cooldown');

        if (jason.attack.cooldownTimer > 0) {
            const time = Math.ceil(jason.attack.cooldownTimer / 60); // Frames to seconds
            displayState = `Attack (${time}s)`;
            button.classList.add('cooldown');
        } 
        button.textContent = displayState;
    };
    updateAttackButton();

    // Update Ability Buttons and Cooldowns
    const abilities = jason.abilities;
    const updateAbilityButton = (id, abilityName, hotkey) => {
        const button = document.getElementById(id);
        const ability = abilities[abilityName];
        if (!button || !ability) return;

        let displayState = `${abilityName.toUpperCase()} (${hotkey})`;
        button.classList.remove('cooldown');

        if (ability.cooldownTimer > 0) {
            const time = Math.ceil(ability.cooldownTimer / 60); // Convert frames to seconds (approx 60fps)
            displayState = `${abilityName.toUpperCase()} (${time}s)`;
            button.classList.add('cooldown');
        } 
        
        if (abilityName === 'rage' && jason.isRageActive) {
             displayState = `RAGE (PERM)`;
             button.classList.add('cooldown'); 
        }

        button.textContent = displayState;
    };
    
    updateAbilityButton('ability-dash', 'dash', 'Q');
    updateAbilityButton('ability-vision', 'vision', 'V');
    // --- SYNTAX ERROR FIX ---
    // I found a syntax error here from the last edit and fixed it.
    updateAbilityButton('ability-teleport', 'teleport', 'E'); // Was missing quotes around 'E'
    // ------------------------
    updateAbilityButton('ability-rage', 'rage', 'R');

    // Update Ability Status
    let statusText = 'Normal';
    if (jason.isVisionActive) {
        statusText = 'Vision Mode Active';
    } else if (isDashing) {
        statusText = 'Dashing';
    } else if (jason.isRageActive) {
        statusText = 'Raged';
    }
    document.getElementById('ability-status').textContent = statusText;
}


// --- 7. Main Game Loop ---

function gameLoop() {
    if (!isGameRunning) return; 

    update();
    draw();

    requestAnimationFrame(gameLoop); 
}
